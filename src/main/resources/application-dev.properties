# Development environment configuration
# This file contains development-specific settings

# Database configuration for development
# Credentials are read from environment variables - never commit passwords
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/anwesenheit}
spring.datasource.username=${DB_USERNAME:admin_db}
spring.datasource.password=${DB_PASSWORD}

# Hibernate configuration for development
# Schema changes are made by Flyway migrations; Hibernate only checks that the entities match
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development logging
logging.level.com.art.erfassung=debug
logging.level.org.springframework.web=debug
