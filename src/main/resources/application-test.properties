# Test environment configuration
# This file contains test-specific settings

# In-memory database for testing, in MariaDB compatibility mode so the Flyway migrations run unchanged
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use this database in @DataJpaTest as well instead of replacing it with a plain embedded database
spring.test.database.replace=none

# The schema is created by Flyway; Hibernate checks that the entities match the migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Test logging
logging.level.com.art.erfassung=debug
logging.level.org.springframework.web=warn
