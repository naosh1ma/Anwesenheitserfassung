spring.application.name=erfassung

# Turn off the Spring Boot banner
spring.main.banner-mode=off

# Reduce logging level. Set logging level to warn
logging.level.root=warn

# First administrator, created at startup if no administrator exists yet
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Start of lessons: arrival times after this count as late (format HH:mm)
app.unterricht.beginn=${UNTERRICHTSBEGINN:08:00}

# The database schema is managed by Flyway (src/main/resources/db/migration).
# A database that existed before Flyway is marked as version 1 on first start, then V2 and later are applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# The UI is German-only: format numbers and dates in German regardless of the browser language
spring.web.locale=de_DE
spring.web.locale-resolver=fixed

# Database configuration is loaded from application-{profile}.properties.
# No profile is active by default: start with SPRING_PROFILES_ACTIVE=dev (development) or prod.