spring.application.name=erfassung

# Turn off the Spring Boot banner
spring.main.banner-mode=off

# Reduce logging level. Set logging level to warn
logging.level.root=warn

# First administrator, created at startup if no administrator exists yet
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# The UI is German-only: format numbers and dates in German regardless of the browser language
spring.web.locale=de_DE
spring.web.locale-resolver=fixed

# Database configuration will be loaded from application-{profile}.properties
# Default profile is 'dev' - use environment variables for production
spring.profiles.active=dev