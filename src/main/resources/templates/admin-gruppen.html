<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Gruppen verwalten</title>
</head>
<body>
<div layout:fragment="content" class="stack">
    <div class="page-head">
        <div class="page-head__main">
            <h1 class="page-head__title">Gruppen verwalten</h1>
            <p class="page-head__text">Gruppen anlegen, umbenennen und ihre Studenten verwalten.</p>
        </div>
    </div>

    <div class="card empty" th:if="${gruppen.empty}">
        <h2 class="empty__title">Noch keine Gruppen</h2>
        <p class="muted">Legen Sie unten die erste Gruppe an.</p>
    </div>

    <div class="card" th:unless="${gruppen.empty}">
        <div class="table-scroll">
            <table class="table">
                <thead>
                <tr>
                    <th>Gruppe</th>
                    <th>Studenten</th>
                    <th>Umbenennen</th>
                    <th class="table__actions"><span class="visually-hidden">Aktionen</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="gruppe : ${gruppen}"
                    th:with="aktiv=${aktiveStudenten[gruppe.id]}, deaktiviert=${deaktivierteStudenten[gruppe.id]}">
                    <td class="table__strong" th:text="${gruppe.bezeichnung}">Gruppe</td>
                    <td>
                        <span th:text="|${aktiv} aktiv|">0 aktiv</span>
                        <span th:if="${deaktiviert > 0}" class="inaktiv-hinweis" th:text="|· ${deaktiviert} deaktiviert|"></span>
                    </td>
                    <td>
                        <form th:action="@{/admin/gruppen/{id}/umbenennen(id=${gruppe.id})}" method="post" class="inline-form">
                            <input type="text" name="bezeichnung" class="input" required th:value="${gruppe.bezeichnung}"
                                   th:attr="aria-label=|Neue Bezeichnung für ${gruppe.bezeichnung}|">
                            <button type="submit" class="btn btn--secondary">Umbenennen</button>
                        </form>
                    </td>
                    <td class="table__actions">
                        <div class="inline-form inline-form--end">
                            <a th:href="@{/admin/gruppen/{id}(id=${gruppe.id})}" class="btn btn--secondary">
                                <svg th:replace="~{fragments/icons :: users}"></svg>
                                <span>Studenten verwalten</span>
                            </a>
                            <!-- Nur leere Gruppen können gelöscht werden -->
                            <form th:if="${aktiv + deaktiviert == 0}"
                                  th:action="@{/admin/gruppen/{id}/loeschen(id=${gruppe.id})}" method="post" class="inline-form"
                                  onsubmit="return confirm('Diese Gruppe wirklich löschen?');">
                                <button type="submit" class="btn btn--danger">Löschen</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <section class="card card--padded stack">
        <h2 class="section-title">Neue Gruppe anlegen</h2>
        <form th:action="@{/admin/gruppen}" method="post" class="form-grid">
            <div class="field">
                <label class="label" for="bezeichnung">Bezeichnung</label>
                <input type="text" class="input" id="bezeichnung" name="bezeichnung" required>
            </div>
            <div class="form-grid__actions">
                <button type="submit" class="btn btn--primary">Gruppe anlegen</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
