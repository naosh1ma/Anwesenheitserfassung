<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anwesenheitserfassung</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        /* Falls nötig, grundlegende Stile für die Toggle-Bereiche */
        .toggle-button {
            margin-left: 10px;
            padding: 5px 10px;
        }

        .radio-group {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-container">
        <div class="logo">
            <a href="#" class="navbar-logo">
                <img th:src="@{/images/logo.png}" alt="logo"/>
            </a>
        </div>
        <ul class="menu">
            <li><a th:href="@{/willkommen}">Startseite</a></li>
            <li><a th:href="@{/gruppen}">Gruppen</a></li>
            <li><a th:href="@{/anwesenheit/{id}(id=${gruppe.id})}">Erfassung</a></li>
            <li><a th:href="@{/liste/{id}(id=${gruppe.id})}">Kursübersicht</a></li>
        </ul>
    </div>
</nav>

<!-- Hauptinhalt -->
<div class="content container mt-4">
    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}"></span>
        <ul th:if="${errorDetails}">
            <li th:each="detail : ${errorDetails}" th:text="${detail}"></li>
        </ul>
    </div>

    <h2 th:if="${gruppe != null}">
        Anwesenheitserfassung für Gruppe: <span th:text="${gruppe.bezeichnung}"></span>
    </h2>
    <p>Heutiges Datum: <span th:text="${#dates.format(#dates.createNow(), 'dd.MM.yyyy')}"></span></p>

    <!-- Formularbindung an anwesenheitForm -->
    <form th:action="@{/anwesenheit/{id}/speichern(id=${gruppe.id})}" th:object="${anwesenheitForm}" method="post">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Student</th>
                <th>Status</th>
                <th>Ankunftszeit</th>
                <th>Verlassen um</th>
                <th>Kommentar</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iteriere über die Liste von "eintraege" -->
            <tr th:each="eintrag, iter : *{eintraege}">
                <td>
                    <!-- Bindung für Studenten-ID und Anzeige des Studentennamens -->
                    <input type="hidden" th:field="*{eintraege[__${iter.index}__].studentenId}"/>
                    <span th:text="*{eintraege[__${iter.index}__].studentenName}">Student Name</span>
                </td>
                <td th:with="abwesend=${eintrag.statusId != anwesendStatusId}">
                    <!-- Standardbereich: "Anwesend" (vorausgewählt) und Button zur Auswahl eines Abwesenheitsgrunds -->
                    <div th:id="|statusDefault_${iter.index}|" th:style="${abwesend} ? 'display: none;'">
                        <div class="radio-group">
                            <input type="radio"
                                   th:field="*{eintraege[__${iter.index}__].statusId}"
                                   th:id="|anwesend_${iter.index}|"
                                   th:value="${anwesendStatusId}"/>
                            <label th:for="|anwesend_${iter.index}|">Anwesend</label>
                        </div>
                        <div class="radio-group">
                            <button type="button" class="toggle-button" th:onclick="|showDetailed(${iter.index})|">
                                Abwesend
                            </button>
                        </div>
                    </div>

                    <!-- Detaillierter Bereich: alle übrigen Status als Abwesenheitsgründe -->
                    <div th:id="|statusDetailed_${iter.index}|" th:style="${abwesend} ? '' : 'display: none;'">
                        <div class="radio-group" th:each="status : ${statusListe}" th:unless="${status.id == anwesendStatusId}">
                            <input type="radio"
                                   th:field="*{eintraege[__${iter.index}__].statusId}"
                                   th:id="|status_${iter.index}_${status.id}|"
                                   th:value="${status.id}"/>
                            <label th:for="|status_${iter.index}_${status.id}|" th:text="${status.bezeichnung}">Status</label>
                        </div>
                        <!-- Button, um zurück zum Standardbereich zu wechseln -->
                        <div class="radio-group">
                            <button type="button" class="toggle-button" th:onclick="|hideDetailed(${iter.index})|">
                                Zurück
                            </button>
                        </div>
                    </div>
                </td>
                <td>
                    <input type="time" class="form-control" th:field="*{eintraege[__${iter.index}__].ankunftszeit}"/>
                </td>
                <td>
                    <input type="time" class="form-control" th:field="*{eintraege[__${iter.index}__].verlassenUm}"/>
                </td>
                <td>
                    <input type="text" class="form-control" th:field="*{eintraege[__${iter.index}__].kommentar}"
                           placeholder="Kommentar (optional)"/>
                </td>
            </tr>
            </tbody>
        </table>
        <button type="submit" class="btn btn-success">Speichern</button>
    </form>
    <a th:href="@{/gruppen}" class="btn btn-primary mt-3">Zurück zur Gruppenübersicht</a>
</div>

<!-- JavaScript zur Umschaltung -->
<script type="text/javascript">
    // Blendet die Abwesenheitsgründe ein. "Anwesend" wird abgewählt, damit ein Grund gewählt werden muss.
    function showDetailed(index) {
        document.getElementById("statusDefault_" + index).style.display = "none";
        document.getElementById("statusDetailed_" + index).style.display = "block";
        document.getElementById("anwesend_" + index).checked = false;
    }

    // Kehrt zum Standardbereich zurück und wählt wieder "Anwesend" aus.
    function hideDetailed(index) {
        document.getElementById("statusDetailed_" + index).style.display = "none";
        document.getElementById("statusDefault_" + index).style.display = "block";
        document.getElementById("anwesend_" + index).checked = true;
    }
</script>
</body>
</html>
