<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Monatsübersicht</title>
</head>
<body>
<div layout:fragment="content" class="stack">
    <div class="page-head">
        <div class="page-head__main">
            <nav class="breadcrumb" aria-label="Pfad">
                <a th:href="@{/gruppen}">Gruppen</a>
                <span class="breadcrumb__sep">/</span>
                <span th:text="${gruppe.bezeichnung}">Gruppe</span>
            </nav>
            <h1 class="page-head__title">Monatsübersicht</h1>
        </div>
        <div class="page-head__actions">
            <div class="month-switch">
                <a th:href="@{/liste/{id}(id=${gruppe.id},monat=${vorherigerMonat})}" class="month-switch__step" aria-label="Vorheriger Monat">
                    <svg th:replace="~{fragments/icons :: chevron-left}"></svg>
                </a>
                <span class="month-switch__label" th:text="${#temporals.format(monatStart, 'MMMM yyyy')}">Monat</span>
                <a th:href="@{/liste/{id}(id=${gruppe.id},monat=${naechsterMonat})}" class="month-switch__step" aria-label="Nächster Monat">
                    <svg th:replace="~{fragments/icons :: chevron-right}"></svg>
                </a>
            </div>
            <a th:href="@{/anwesenheit/{id}(id=${gruppe.id})}" class="btn btn--primary">
                <svg th:replace="~{fragments/icons :: check}"></svg>
                <span>Anwesenheit erfassen</span>
            </a>
        </div>
    </div>

    <div class="legend">
        <span class="legend__item"><span class="dot dot--present"></span>Anwesend</span>
        <span class="legend__item"><span class="chip chip--sm chip--entschuldigt">E</span>Entschuldigt</span>
        <span class="legend__item"><span class="chip chip--sm chip--unentschuldigt">U</span>Unentschuldigt</span>
        <span class="legend__item"><span class="chip chip--sm chip--krankmeldung">K</span>Krankmeldung</span>
        <span class="legend__item"><span class="chip chip--sm chip--weekend"></span>Wochenende</span>
    </div>

    <div class="card empty" th:if="${studenten.empty}">
        <p class="muted">Diese Gruppe hat keine Studenten mit Erfassungen in diesem Monat.</p>
    </div>

    <div class="card" th:unless="${studenten.empty}">
        <div class="table-scroll">
            <table class="month">
                <thead>
                <tr>
                    <th class="month__name" scope="col">Student</th>
                    <th scope="col" th:each="tag : ${tage}"
                        th:classappend="${tag == heute} ? 'is-today' : (${tag.dayOfWeek.value >= 6} ? 'is-weekend')">
                        <!-- Vergangene Tage und heute öffnen das Erfassungsformular für diesen Tag -->
                        <a th:unless="${tag.isAfter(heute)}" class="month__day-link"
                           th:href="@{/anwesenheit/{id}(id=${gruppe.id},datum=${tag})}"
                           th:title="|Anwesenheit für ${#temporals.format(tag, 'dd.MM.yyyy')} erfassen|">
                            <span class="month__weekday" th:text="${#strings.substring(#temporals.dayOfWeekName(tag), 0, 2)}">Mo</span>
                            <span th:text="${tag.dayOfMonth}">1</span>
                        </a>
                        <th:block th:if="${tag.isAfter(heute)}">
                            <span class="month__weekday" th:text="${#strings.substring(#temporals.dayOfWeekName(tag), 0, 2)}">Mo</span>
                            <span th:text="${tag.dayOfMonth}">1</span>
                        </th:block>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${studenten}" th:classappend="${student.aktiv} ? '' : 'inaktiv'">
                    <th class="month__name" scope="row">
                        <a class="no-underline" th:href="@{/studenten/{id}(id=${student.id})}"
                           th:text="|${student.vorname} ${student.name}|">Student</a>
                        <span th:unless="${student.aktiv}" class="inaktiv-hinweis">deaktiviert</span>
                    </th>
                    <td th:each="tag : ${tage}"
                        th:with="erfassung=${zellen[student.id][tag.dayOfMonth]}"
                        th:classappend="${tag == heute} ? 'is-today' : (${tag.dayOfWeek.value >= 6} ? 'is-weekend')"
                        th:title="${erfassung != null} ? ${erfassung.status.bezeichnung
                            + (erfassung.ankunftszeit != null ? ', Ankunft ' + erfassung.ankunftszeit : '')
                            + (erfassung.verlassenUm != null ? ', Verlassen ' + erfassung.verlassenUm : '')}">
                        <!-- Ein Klick auf die Zelle öffnet den Tag im Erfassungsformular (per Tastatur über die Spaltenüberschrift) -->
                        <a th:unless="${tag.isAfter(heute)}" class="month__cell-link" tabindex="-1" aria-hidden="true"
                           th:href="@{/anwesenheit/{id}(id=${gruppe.id},datum=${tag})}">
                            <th:block th:if="${erfassung != null}">
                                <span th:if="${erfassung.status.bezeichnung == 'Anwesend'}" class="dot dot--present"></span>
                                <span th:unless="${erfassung.status.bezeichnung == 'Anwesend'}" class="chip"
                                      th:classappend="|chip--${#strings.toLowerCase(erfassung.status.bezeichnung)}|"
                                      th:text="${#strings.substring(erfassung.status.bezeichnung, 0, 1)}">E</span>
                            </th:block>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
