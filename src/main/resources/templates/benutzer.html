<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Benutzer</title>
</head>
<body>
<div layout:fragment="content" class="stack">
    <div class="page-head">
        <div class="page-head__main">
            <h1 class="page-head__title">Benutzer</h1>
            <p class="page-head__text">Konten für Lehrer und Administratoren verwalten.</p>
        </div>
    </div>

    <div class="card">
        <div class="table-scroll">
            <table class="table">
                <thead>
                <tr>
                    <th>Benutzername</th>
                    <th>Name</th>
                    <th>Rolle</th>
                    <th>Gruppen</th>
                    <th>Neues Passwort</th>
                    <th class="table__actions"><span class="visually-hidden">Aktionen</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="benutzer : ${benutzerListe}">
                    <td class="table__strong" th:text="${benutzer.benutzername}">login</td>
                    <td th:text="|${benutzer.vorname ?: ''} ${benutzer.name ?: ''}|">Name</td>
                    <td>
                        <span class="badge" th:classappend="${benutzer.rolle?.name() == 'ADMIN'} ? 'badge--accent'"
                              th:text="${benutzer.rolle?.bezeichnung}">Rolle</span>
                    </td>
                    <td>
                        <span th:if="${benutzer.admin}" class="muted">Alle Gruppen</span>
                        <th:block th:unless="${benutzer.admin}">
                            <span th:if="${benutzer.gruppen.empty}" class="inaktiv-hinweis">Keine Gruppen</span>
                            <span th:unless="${benutzer.gruppen.empty}"
                                  th:text="${#strings.listJoin(#lists.sort(benutzer.gruppen.![bezeichnung]), ', ')}">Gruppen</span>
                        </th:block>
                    </td>
                    <td>
                        <form th:action="@{/admin/benutzer/{id}/passwort(id=${benutzer.id})}" method="post" class="inline-form">
                            <input type="password" name="passwort" class="input" required minlength="8"
                                   placeholder="mind. 8 Zeichen" autocomplete="new-password"
                                   th:attr="aria-label=|Neues Passwort für ${benutzer.benutzername}|">
                            <button type="submit" class="btn btn--secondary">Setzen</button>
                        </form>
                    </td>
                    <td class="table__actions">
                        <div class="inline-form inline-form--end">
                            <a th:unless="${benutzer.admin}" th:href="@{/admin/benutzer/{id}/gruppen(id=${benutzer.id})}"
                               class="btn btn--secondary">Gruppen zuweisen</a>
                            <!-- Das eigene Konto kann nicht gelöscht werden -->
                            <form th:unless="${benutzer.benutzername == #authentication.name}"
                                  th:action="@{/admin/benutzer/{id}/loeschen(id=${benutzer.id})}" method="post"
                                  class="inline-form"
                                  onsubmit="return confirm('Diesen Benutzer wirklich löschen?');">
                                <button type="submit" class="btn btn--danger">Löschen</button>
                            </form>
                            <span th:if="${benutzer.benutzername == #authentication.name}" class="muted text-sm">Ihr Konto</span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <section class="card card--padded stack">
        <h2 class="section-title">Neuen Benutzer anlegen</h2>
        <form th:action="@{/admin/benutzer}" th:object="${benutzerForm}" method="post" class="form-grid">
            <div class="field">
                <label class="label" for="benutzername">Benutzername</label>
                <input type="text" class="input" th:field="*{benutzername}" required autocomplete="off">
            </div>
            <div class="field">
                <label class="label" for="rolle">Rolle</label>
                <select class="select" th:field="*{rolle}">
                    <option th:each="r : ${rollen}" th:value="${r}" th:text="${r.bezeichnung}">Rolle</option>
                </select>
            </div>
            <div class="field">
                <label class="label" for="vorname">Vorname</label>
                <input type="text" class="input" th:field="*{vorname}" required>
            </div>
            <div class="field">
                <label class="label" for="name">Nachname</label>
                <input type="text" class="input" th:field="*{name}" required>
            </div>
            <div class="field">
                <label class="label" for="passwort">Passwort (mindestens 8 Zeichen)</label>
                <input type="password" class="input" th:field="*{passwort}" required minlength="8" autocomplete="new-password">
            </div>
            <fieldset class="field form-grid__wide" th:unless="${alleGruppen.empty}">
                <legend class="label">Gruppen (nur für Lehrer)</legend>
                <div class="check-grid">
                    <label class="check" th:each="g : ${alleGruppen}">
                        <input type="checkbox" th:field="*{gruppenIds}" th:value="${g.id}">
                        <span th:text="${g.bezeichnung}">Gruppe</span>
                    </label>
                </div>
            </fieldset>
            <div class="form-grid__actions">
                <button type="submit" class="btn btn--primary">Benutzer anlegen</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
