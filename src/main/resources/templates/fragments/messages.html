<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Success Messages -->
<div th:fragment="success-message" th:if="${successMessage}" class="alert alert--success" role="status">
    <svg th:replace="~{fragments/icons :: check-circle}"></svg>
    <span th:text="${successMessage}"></span>
</div>

<!-- Error Messages (optional mit einer Liste von Details, z. B. Validierungsfehler) -->
<div th:fragment="error-message" th:if="${errorMessage}" class="alert alert--error" role="alert">
    <svg th:replace="~{fragments/icons :: alert-circle}"></svg>
    <div>
        <span th:text="${errorMessage}"></span>
        <ul th:if="${errorDetails}" class="alert__details">
            <li th:each="detail : ${errorDetails}" th:text="${detail}"></li>
        </ul>
    </div>
</div>

<!-- Info Messages -->
<div th:fragment="info-message" th:if="${infoMessage}" class="alert alert--info" role="status">
    <svg th:replace="~{fragments/icons :: info}"></svg>
    <span th:text="${infoMessage}"></span>
</div>

<!-- Warning Messages -->
<div th:fragment="warning-message" th:if="${warningMessage}" class="alert alert--warning" role="status">
    <svg th:replace="~{fragments/icons :: alert-circle}"></svg>
    <span th:text="${warningMessage}"></span>
</div>

<!-- All Messages Combined -->
<div th:fragment="all-messages">
    <div th:replace="~{fragments/messages :: success-message}"></div>
    <div th:replace="~{fragments/messages :: error-message}"></div>
    <div th:replace="~{fragments/messages :: info-message}"></div>
    <div th:replace="~{fragments/messages :: warning-message}"></div>
</div>

</body>
</html>
