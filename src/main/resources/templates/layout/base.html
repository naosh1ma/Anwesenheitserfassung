<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE – Anwesenheitserfassung">Anwesenheitserfassung</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/png">

    <!-- Additional head content -->
    <th:block layout:fragment="head"></th:block>
</head>
<body>
    <header class="app-header">
        <div class="app-header__inner">
            <div class="app-header__left">
                <a th:href="@{/gruppen}" class="brand" aria-label="Anwesenheitserfassung, zur Gruppenübersicht">
                    <svg th:replace="~{fragments/icons :: brand}"></svg>
                    <span class="brand__text">Anwesenheitserfassung</span>
                </a>
                <nav class="nav" aria-label="Hauptnavigation">
                    <a th:href="@{/gruppen}" class="nav__link"
                       th:classappend="${aktiveNavigation == 'gruppen'} ? 'is-active'">Gruppen</a>
                    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin/gruppen}" class="nav__link"
                       th:classappend="${aktiveNavigation == 'verwaltung'} ? 'is-active'">Gruppen verwalten</a>
                    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin/benutzer}" class="nav__link"
                       th:classappend="${aktiveNavigation == 'benutzer'} ? 'is-active'">Benutzer</a>
                </nav>
            </div>
            <div class="user">
                <div class="user__meta">
                    <span class="user__name" th:text="${#authentication.name}">Benutzer</span>
                    <span class="user__role"
                          th:text="${#authorization.expression('hasRole(''ADMIN'')')} ? 'Administrator' : 'Lehrer'">Lehrer</span>
                </div>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn--secondary" aria-label="Abmelden">
                        <svg th:replace="~{fragments/icons :: logout}"></svg>
                        <span class="btn__text">Abmelden</span>
                    </button>
                </form>
            </div>
        </div>
    </header>

    <main class="page">
        <!-- Erfolgs- und Fehlermeldungen -->
        <div th:replace="~{fragments/messages :: all-messages}"></div>

        <!-- Seiteninhalt (jede Seite rendert ihre eigene Überschrift) -->
        <th:block layout:fragment="content"></th:block>
    </main>

    <!-- Additional scripts -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
