<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden – Anwesenheitserfassung</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/png">
</head>
<body>

<main class="auth">
    <div class="auth__box">
        <div class="brand auth__brand">
            <svg th:replace="~{fragments/icons :: brand}"></svg>
            <span>Anwesenheitserfassung</span>
        </div>

        <div class="card auth__card">
            <div class="auth__heading">
                <h1 class="auth__title">Anmelden</h1>
                <p class="muted">Melden Sie sich mit Ihrem Benutzerkonto an.</p>
            </div>

            <div th:if="${error}" class="alert alert--error" role="alert">
                <svg th:replace="~{fragments/icons :: alert-circle}"></svg>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${message}" class="alert alert--success" role="status">
                <svg th:replace="~{fragments/icons :: check-circle}"></svg>
                <span th:text="${message}"></span>
            </div>

            <form th:action="@{/login}" method="post" class="form-stack">
                <div class="field">
                    <label class="label" for="username">Benutzername</label>
                    <input class="input input--lg" type="text" id="username" name="username" required
                           autocomplete="username" autofocus>
                </div>
                <div class="field">
                    <label class="label" for="password">Passwort</label>
                    <input class="input input--lg" type="password" id="password" name="password" required
                           autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn--primary btn--lg btn--block">Anmelden</button>
            </form>
        </div>

        <p class="auth__note">Kein Zugang? Wenden Sie sich an die Administration.</p>
    </div>
</main>

</body>
</html>
