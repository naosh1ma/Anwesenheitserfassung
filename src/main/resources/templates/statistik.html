<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="|Statistik: ${statistik.student.vorname} ${statistik.student.name}|">Statistik</title>
</head>
<body>
<div layout:fragment="content" class="stack" th:with="student=${statistik.student}">
    <div class="page-head">
        <div class="page-head__main">
            <nav class="breadcrumb" aria-label="Pfad">
                <a th:href="@{/gruppen}">Gruppen</a>
                <span class="breadcrumb__sep">/</span>
                <a th:href="@{/liste/{id}(id=${student.gruppeId})}" th:text="${student.gruppeBezeichnung}">Gruppe</a>
            </nav>
            <h1 class="page-head__title" th:text="|${student.vorname} ${student.name}|">Student</h1>
            <p class="page-head__text">Statistik über alle erfassten Tage</p>
        </div>
        <a th:href="@{/liste/{id}(id=${student.gruppeId})}" class="btn btn--secondary">
            <svg th:replace="~{fragments/icons :: calendar}"></svg>
            <span>Monatsübersicht</span>
        </a>
    </div>

    <div class="stats">
        <div class="card stat">
            <span class="stat__label"><span class="dot dot--present"></span>Anwesenheit</span>
            <span class="stat__value" th:text="${#numbers.formatDecimal(statistik.gesamtAnwesenheit, 1, 1)} + '%'">0%</span>
        </div>
        <div class="card stat">
            <span class="stat__label"><span class="chip chip--sm chip--entschuldigt">E</span>Entschuldigt</span>
            <span class="stat__value" th:text="${statistik.entschuldigt}">0</span>
        </div>
        <div class="card stat">
            <span class="stat__label"><span class="chip chip--sm chip--unentschuldigt">U</span>Unentschuldigt</span>
            <span class="stat__value" th:text="${statistik.unentschuldigt}">0</span>
        </div>
        <div class="card stat">
            <span class="stat__label"><span class="chip chip--sm chip--krankmeldung">K</span>Krankmeldungen</span>
            <span class="stat__value" th:text="${statistik.krank}">0</span>
        </div>
        <div class="card stat">
            <span class="stat__label"><svg th:replace="~{fragments/icons :: clock}"></svg>Verspätungen</span>
            <span class="stat__value" th:text="${statistik.verspaetungen}">0</span>
        </div>
    </div>
</div>
</body>
</html>
