<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen - Erfassung</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/png">
</head>
<body>

<div class="container">
    <header class="header">
        <h1>Willkommen, <span th:text="${username}">Benutzer</span>!</h1>
        <div class="user-info">
            <span th:if="${isAdmin}" class="role-badge admin">Administrator</span>
            <span th:unless="${isAdmin}" class="role-badge teacher">Lehrer</span>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-link">Abmelden</button>
            </form>
        </div>
    </header>

    <main class="main-content">
        <div class="welcome-message">
            <h2>Anwesenheitserfassung System</h2>
            <p>Willkommen im Anwesenheitserfassungssystem. Hier können Sie die Anwesenheit von Studenten verwalten und Statistiken einsehen.</p>
        </div>

        <div class="action-buttons">
            <a th:href="@{/gruppen}" class="btn btn-primary">
                <span class="icon">📚</span>
                Gruppen verwalten
            </a>
        </div>
    </main>
</div>

</body>
</html>
